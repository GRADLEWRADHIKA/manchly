<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Manchly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-mark">manchly</div>
    <h1>Admin Console</h1>
    <p class="subtitle">Sign in with your admin account — we'll email you a one-time code.</p>

    <div id="step-email" class="step">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />
      <button type="button" id="btn-send-otp" class="btn btn-primary">Send OTP</button>
    </div>

    <div id="step-otp" class="step hidden">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="······" maxlength="6" autocomplete="one-time-code" inputmode="numeric" />
      <button type="button" id="btn-verify" class="btn btn-primary">Verify &amp; Login</button>
      <button type="button" id="btn-back" class="btn btn-ghost">Change email</button>
    </div>

    <p id="message" class="message"></p>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');
    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const btnSendOtp = document.getElementById('btn-send-otp');
    const btnVerify = document.getElementById('btn-verify');
    const btnBack = document.getElementById('btn-back');
    const messageEl = document.getElementById('message');

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (isError ? 'error' : 'success');
      messageEl.hidden = !text;
    }

    btnSendOtp.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage('Please enter your email', true);
        return;
      }
      showMessage('');
      btnSendOtp.disabled = true;
      try {
        const res = await fetch(API_BASE + '/auth/send-otp/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, purpose: 'login', tab: 'ADMIN' })
        });
        const data = await res.json();
        if (data.success) {
          stepEmail.classList.add('hidden');
          stepOtp.classList.remove('hidden');
          otpInput.value = '';
          otpInput.focus();
          showMessage('OTP sent to your email', false);
          if (data.data && data.data.otp) {
            showMessage('Your OTP: ' + data.data.otp + ' (dev only)', false);
            otpInput.value = data.data.otp;
          }
        } else {
          showMessage(data.error?.message || 'Failed to send OTP', true);
        }
      } catch (e) {
        showMessage('Network error. Try again.', true);
      }
      btnSendOtp.disabled = false;
    });

    btnVerify.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const code = otpInput.value.trim();
      if (!code) {
        showMessage('Please enter the OTP', true);
        return;
      }
      showMessage('');
      btnVerify.disabled = true;
      try {
        const res = await fetch(API_BASE + '/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, purpose: 'login', user_type: 'ADMIN' })
        });
        const data = await res.json();
        if (data.success && data.data?.token) {
          setToken(data.data.token);
          window.location.href = '/dashboard.html';
        } else {
          showMessage(data.error?.message || 'Invalid OTP', true);
        }
      } catch (e) {
        showMessage('Network error. Try again.', true);
      }
      btnVerify.disabled = false;
    });

    btnBack.addEventListener('click', () => {
      stepOtp.classList.add('hidden');
      stepEmail.classList.remove('hidden');
      showMessage('');
    });

    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnSendOtp.click(); });
    otpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnVerify.click(); });
  </script>
</body>
</html>
