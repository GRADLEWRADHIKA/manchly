<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F9FAFB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #111827;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.12);
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
        }
        .icon-wrap {
            width: 72px;
            height: 72px;
            background: #FEF9E3;
            color: #EAB308;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 18px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 0.92rem; line-height: 1.6; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #FDE68A;
            border-top-color: #EAB308;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            background: #111827;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            text-decoration: none;
            font-family: inherit;
        }
        .btn:hover { background: #EAB308; color: #000; }
        .err { color: #991B1B; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap" id="iconWrap"><i class="fas fa-lock"></i></div>
        <h1 id="title">Preparing secure checkout…</h1>
        <div id="orderSummary" style="display:none; background:#FEFCE8; border:1px solid #FDE68A; border-radius:14px; padding:14px 18px; margin:16px 0; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
                <div>
                    <div style="font-size:0.72rem; color:#92400E; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Total Payable</div>
                    <div id="orderTitle" style="font-size:0.82rem; color:#374151; margin-top:2px;"></div>
                </div>
                <div id="orderAmount" style="font-size:1.4rem; font-weight:800; color:#111827; white-space:nowrap;"></div>
            </div>
        </div>
        <p id="message"><span class="spinner"></span> Please wait, do not close this window.</p>
        <div id="actions"></div>
    </div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const orderId   = params.get('order_id');
    const env       = (params.get('env') || 'production').toLowerCase() === 'sandbox' ? 'sandbox' : 'production';
    const token     = params.get('token');
    const returnTo  = params.get('return_to') || 'https://xtechmoneymatrix.com/';
    const amount    = params.get('amount');
    const currency  = params.get('currency') || 'INR';
    const courseTitle = params.get('title') || 'Course Enrollment';

    if (amount) {
        const symbol = currency === 'INR' ? '₹' : currency + ' ';
        document.getElementById('orderAmount').textContent = symbol + parseFloat(amount).toFixed(2);
        document.getElementById('orderTitle').textContent = courseTitle;
        document.getElementById('orderSummary').style.display = 'block';
    }

    const titleEl   = document.getElementById('title');
    const msgEl     = document.getElementById('message');
    const iconEl    = document.getElementById('iconWrap');
    const actionsEl = document.getElementById('actions');

    function setError(text) {
        iconEl.style.background = '#FEE2E2';
        iconEl.style.color = '#991B1B';
        iconEl.innerHTML = '<i class="fas fa-triangle-exclamation"></i>';
        titleEl.textContent = 'Payment could not complete';
        msgEl.innerHTML = '<span class="err">' + text + '</span>';
        actionsEl.innerHTML = '<a class="btn" href="' + returnTo + '?payment=failed">Back to Site</a>';
    }
    function setSuccess() {
        iconEl.style.background = '#D1FAE5';
        iconEl.style.color = '#065F46';
        iconEl.innerHTML = '<i class="fas fa-check"></i>';
        titleEl.textContent = 'Payment successful!';
        msgEl.textContent = 'Redirecting you back…';
    }

    if (!sessionId || !orderId) {
        setError('Missing payment session. Please try again from the site.');
        return;
    }

    try {
        const cashfree = Cashfree({ mode: env });
        cashfree.checkout({
            paymentSessionId: sessionId,
            redirectTarget: '_modal'
        }).then(async function(result) {
            if (result && result.error) {
                setError(result.error.message || 'Payment was cancelled.');
                return;
            }
            // Verify on backend (optional — webhook also handles enrollment)
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                await fetch('/payments/verify', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ order_id: orderId })
                });
            } catch (e) { /* webhook will reconcile */ }
            setSuccess();
            setTimeout(function() {
                window.location.href = returnTo + (returnTo.indexOf('?') > -1 ? '&' : '?') + 'payment=success&order_id=' + encodeURIComponent(orderId);
            }, 1400);
        }).catch(function(err) {
            setError(err && err.message ? err.message : 'Checkout failed to open.');
        });
    } catch (e) {
        setError('Could not initialize checkout: ' + e.message);
    }
})();
</script>
</body>
</html>
